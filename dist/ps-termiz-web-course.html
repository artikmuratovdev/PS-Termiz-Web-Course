<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PS Termiz Web Course</title>
  <meta name="description" content="Bolalar uchun Web dasturlash asoslari va AI vositalar: 80 ta amaliy dars, taqdimot rejimi, laboratoriya va playground.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e6e5c'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
  <style>
/* Layout: katak daftar (grid paper) ustidagi o'quv jurnali; taqdimot rejimi – sinf doskasi.
   Ranglar modul bo'yicha ma'no tashiydi: HTML – to'q sariq, CSS – ko'k, JS – sariq, AI – binafsha. */
:root {
  --paper: #f4f6f1;
  --grid: rgba(40, 90, 120, 0.07);
  --surface: #ffffff;
  --surface-2: #eef1ea;
  --line: #d7ddd2;
  --ink: #17222c;
  --ink-2: #4c5a66;
  --ink-3: #7a8793;
  --accent: #0e6e5c;
  --accent-soft: #d8efe8;
  --on-accent: #ffffff;
  --ok: #2b8a3e;
  --ok-soft: #dcf3e1;
  --bad: #c92a2a;
  --bad-soft: #fde2e2;
  --warn: #e67700;
  --code-bg: #1d2530;
  --code-ink: #e3e9ef;
  --tk-tag: #ff8f6b;
  --tk-attr: #ffd479;
  --tk-str: #a8e29a;
  --tk-kw: #8fc5ff;
  --tk-com: #7f8c99;
  --tk-num: #f5a8ff;
  --board: #1f3a32;
  --board-2: #274a40;
  --board-ink: #eef4ea;
  --board-dim: #a9c2b6;
  --chalk-y: #ffe28a;
  --chalk-p: #ffb3c7;
  --chalk-b: #9fd3ff;
  --m1: #5c6f82;
  --m2: #d9480f;
  --m3: #1c64d1;
  --m4: #0c8599;
  --m5: #5f3dc4;
  --m6: #c2255c;
  --m7: #b08900;
  --m8: #862e9c;
  --shadow: 0 1px 2px rgba(20, 40, 50, 0.06), 0 6px 20px rgba(20, 40, 50, 0.06);

  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  --r: 12px;
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111815; --grid: rgba(150, 210, 190, 0.05); --surface: #19221e; --surface-2: #202b26; --line: #2f3c36;
    --ink: #e5ece7; --ink-2: #a9b7ae; --ink-3: #7d8c84; --accent: #4cc3a0; --accent-soft: #1d3a31; --on-accent: #07261d;
    --ok: #5fd07a; --ok-soft: #173422; --bad: #ff7b7b; --bad-soft: #3a1b1b; --warn: #ffb14a;
    --code-bg: #0c1116;
    --m1: #93a6b8; --m2: #ff8a5c; --m3: #6ea8ff; --m4: #3cc6d9; --m5: #a58bff; --m6: #ff6f9f; --m7: #f0c53a; --m8: #d57bea;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111815; --grid: rgba(150, 210, 190, 0.05); --surface: #19221e; --surface-2: #202b26; --line: #2f3c36;
  --ink: #e5ece7; --ink-2: #a9b7ae; --ink-3: #7d8c84; --accent: #4cc3a0; --accent-soft: #1d3a31; --on-accent: #07261d;
  --ok: #5fd07a; --ok-soft: #173422; --bad: #ff7b7b; --bad-soft: #3a1b1b; --warn: #ffb14a;
  --code-bg: #0c1116;
  --m1: #93a6b8; --m2: #ff8a5c; --m3: #6ea8ff; --m4: #3cc6d9; --m5: #a58bff; --m6: #ff6f9f; --m7: #f0c53a; --m8: #d57bea;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 16px/1.6 var(--f-body);
}
img { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
code, kbd, pre, .mono { font-family: var(--f-mono); }
kbd {
  display: inline-block; padding: 1px 7px; font-size: 0.85em; border: 1px solid var(--line);
  border-bottom-width: 3px; border-radius: 6px; background: var(--surface);
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1240px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); }
.brand b { font: 800 22px/1 var(--f-display); letter-spacing: -0.01em; }
.brand span { font: 600 12px/1 var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.brand i { font-style: normal; color: var(--accent); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav a {
  padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: 15px;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; font-size: 17px;
}

/* ---------- Generic ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  font-weight: 700; font-size: 15px; text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--ink-2); }
.eyebrow { font: 700 12px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
.chip {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.mchip { color: var(--mc); border-color: color-mix(in srgb, var(--mc) 45%, transparent); background: color-mix(in srgb, var(--mc) 10%, var(--surface)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 200;
  box-shadow: var(--shadow);
}
.field { display: grid; gap: 4px; }
.field label, .field .lbl { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field input, .field select, .field textarea {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-width: 0;
}

/* ---------- Home ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: end;
  padding-block: 20px 28px; border-bottom: 2px solid var(--ink);
}
.hero h1 { font-size: clamp(34px, 5.4vw, 60px); font-weight: 800; letter-spacing: -0.02em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { max-width: 60ch; color: var(--ink-2); font-size: 17px; margin: 12px 0 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stats div { padding: 14px 16px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font: 800 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--ink-2); }
.continue { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.progressbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 14px; }
.progressbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

.filterbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 22px 0 8px; }
.filterbar input { flex: 1 1 240px; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }

.module { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; padding-block: 26px; border-bottom: 1px solid var(--line); }
.module-head .num { font: 800 64px/0.9 var(--f-display); color: var(--mc); font-variant-numeric: tabular-nums; }
.module-head h2 { font-size: 24px; margin-top: 6px; }
.module-head p { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
.module-head .range { font: 600 12px var(--f-mono); color: var(--ink-3); margin-top: 8px; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; align-content: start; }
.lesson-link {
  display: grid; grid-template-columns: 38px minmax(0, 1fr) 20px; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line);
  text-decoration: none; color: var(--ink); min-height: 58px;
}
.lesson-link:hover { border-color: var(--mc); }
.lesson-link .n { font: 700 15px var(--f-mono); color: var(--mc); font-variant-numeric: tabular-nums; }
.lesson-link .t { font-weight: 700; font-size: 14.5px; line-height: 1.3; }
.lesson-link .d { font-size: 12px; color: var(--ink-3); display: block; font-weight: 600; }
.lesson-link .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: transparent; }
.lesson-link.is-done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.lesson-link.is-next { outline: 2px dashed var(--mc); outline-offset: 2px; }

/* ---------- Lesson ---------- */
.lesson-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
.lesson-top h1 { font-size: clamp(28px, 4.2vw, 46px); font-weight: 800; max-width: 22ch; }
.lesson-top .big-n { font: 800 18px var(--f-mono); color: var(--mc); }
.lesson-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; margin-top: 24px; }
.lesson-main { display: grid; gap: 28px; min-width: 0; }
.aside { display: grid; gap: 16px; align-content: start; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.sec h2 { font-size: 26px; margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
.sec h2 small { font: 700 12px var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.goals { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.goals li { padding-left: 30px; position: relative; }
.goals li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 900; font-size: 13px; display: grid; place-items: center; }
.timeline { display: grid; gap: 0; }
.timeline .ph { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.timeline .ph:last-child { border-bottom: 0; }
.timeline .ph b { font: 700 13px var(--f-mono); color: var(--mc); font-variant-numeric: tabular-nums; }
.concept { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.concept-h { padding: 16px 18px 6px; }
.concept-h h3 { font-size: 21px; }
.concept-h p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.concept-body { padding: 12px 18px 18px; display: grid; gap: 12px; }
.codepair { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
.codebox { position: relative; min-width: 0; }
.codebox pre {
  margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: var(--r-sm); padding: 14px 16px;
  overflow-x: auto; font-size: 13.5px; line-height: 1.55; tab-size: 2; max-height: 460px;
}
.codebox .lang { position: absolute; top: 8px; right: 10px; font: 700 11px var(--f-mono); color: var(--tk-com); text-transform: uppercase; }
.preview { min-width: 0; display: grid; grid-template-rows: auto 1fr auto; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: #fff; }
.preview-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); font: 700 11px var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.preview-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.preview-bar span { margin-left: 6px; }
.preview iframe { width: 100%; min-height: 200px; height: 100%; border: 0; background: #fff; display: block; }
.console { background: var(--code-bg); color: var(--code-ink); font: 12.5px/1.5 var(--f-mono); padding: 8px 12px; max-height: 150px; overflow: auto; }
.console:empty { display: none; }
.console div { white-space: pre-wrap; word-break: break-word; }
.console .error { color: #ff8a8a; }
.console .warn { color: #ffd479; }
.console .alert { color: #9fd3ff; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 8px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); font: 800 13px/26px var(--f-mono); text-align: center; }
.callout { border-radius: var(--r); padding: 16px 18px; border: 1px solid var(--line); background: var(--surface); }
.callout.ai { border-color: color-mix(in srgb, var(--m8) 40%, var(--line)); background: color-mix(in srgb, var(--m8) 7%, var(--surface)); }
.callout.hw { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); }
.callout.note { border-style: dashed; }
.prompt-text { white-space: pre-wrap; font: 14px/1.55 var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; margin: 10px 0; }
.quiz { display: grid; gap: 16px; }
.q { display: grid; gap: 8px; }
.q p { margin: 0; font-weight: 800; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { text-align: left; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.opt:hover { border-color: var(--ink-3); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.score { font: 800 18px var(--f-display); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }

/* ---------- Labs ---------- */
.lab { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 14px; display: grid; gap: 12px; }
.lab-h { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.lab-h b { font: 800 17px var(--f-display); }
.lab-grid { display: grid; grid-template-columns: minmax(200px, 260px) minmax(0, 1fr); gap: 14px; }
.lab-controls { display: grid; gap: 10px; align-content: start; min-width: 0; }
.lab-controls .ctl { display: grid; gap: 3px; }
.lab-controls .ctl > span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.lab-controls .ctl > span output { font-family: var(--f-mono); color: var(--ink); }
.lab-controls input[type="range"] { width: 100%; accent-color: var(--accent); }
.lab-controls select, .lab-controls input[type="text"], .lab-controls textarea { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); width: 100%; }
.lab-controls input[type="color"] { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 2px; }
.lab-stage { min-width: 0; display: grid; gap: 10px; align-content: start; }
.stage { background: #fff; color: #1a1a1a; border: 1px solid var(--line); border-radius: var(--r-sm); min-height: 240px; position: relative; overflow: hidden; }
.lab pre.out { margin: 0; background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: var(--r-sm); font-size: 13px; overflow-x: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; cursor: pointer; font-size: 13px; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--paper); }
.labs-index { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 16px 0 24px; }
.lab-card { text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.lab-card:hover, .lab-card[aria-current="page"] { border-color: var(--accent); }
.lab-card[aria-current="page"] { box-shadow: inset 0 0 0 1px var(--accent); }
.lab-card b { font: 800 17px var(--f-display); }
.lab-card span { font-size: 13px; color: var(--ink-2); }
.lab-card small { font: 600 11px var(--f-mono); color: var(--ink-3); }

/* ---------- Playground ---------- */
.pg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; min-height: 70vh; }
.pg-ed { display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--code-bg); min-width: 0; }
.pg-tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 6px 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pg-tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; border-radius: 8px 8px 0 0; font: 700 13px var(--f-mono); cursor: pointer; color: var(--ink-2); }
.pg-tabs button.on { background: var(--code-bg); color: #fff; }
.pg-tabs button[data-k="html"].on { box-shadow: inset 0 3px 0 var(--m2); }
.pg-tabs button[data-k="css"].on { box-shadow: inset 0 3px 0 var(--m3); }
.pg-tabs button[data-k="js"].on { box-shadow: inset 0 3px 0 var(--m7); }
.pg textarea {
  width: 100%; height: 100%; min-height: 420px; resize: none; border: 0; outline: 0; padding: 14px 16px;
  background: var(--code-bg); color: var(--code-ink); font: 14px/1.6 var(--f-mono); tab-size: 2; white-space: pre; caret-color: #fff;
}
.pg-out { display: grid; grid-template-rows: auto 1fr auto; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface-2); min-width: 0; }

  function injectCss() {
    if (document.getElementById("lab-css")) return;
    const s = document.createElement("style");
    s.id = "lab-css";
    s.textContent = css;
    document.head.appendChild(s);
  }

  /* ---- Umumiy boshqaruv elementlari ---- */
  function controlHtml(c, id) {
    const lbl = `<span>${esc(c.label)}${c.type === "range" ? ` <output>${c.val}${c.unit || ""}</output>` : ""}</span>`;
    if (c.type === "range") return `<label class="ctl">${lbl}<input id="${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step || 1}" value="${c.val}"></label>`;
    if (c.type === "select") return `<label class="ctl">${lbl}<select id="${id}">${c.opts.map((o) => `<option${o === c.val ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    if (c.type === "color") return `<label class="ctl">${lbl}<input id="${id}" type="color" value="${c.val}"></label>`;
    if (c.type === "check") return `<label class="ctl" style="display:flex;gap:8px;align-items:center"><input id="${id}" type="checkbox"${c.val ? " checked" : ""}> <span style="display:inline">${esc(c.label)}</span></label>`;
    return "";
  }
  function specLab(def) {
    return function (body) {
      const base = "lab" + ++uid;
      body.innerHTML = `<div class="lab-grid">
        <div class="lab-controls">${def.spec.map((c) => controlHtml(c, base + c.k)).join("")}</div>
        <div class="lab-stage"><div class="stage${def.pad ? " pad" : ""}"></div><pre class="out"></pre></div></div>`;
      const stage = body.querySelector(".stage");
      const out = body.querySelector(".out");
      if (def.init) def.init(stage);
      const read = () => {
        const v = {};
        def.spec.forEach((c) => {
          const el = body.querySelector("#" + base + c.k);
          v[c.k] = c.type === "check" ? el.checked : c.type === "range" ? Number(el.value) : el.value;
          if (c.type === "range") el.previousElementSibling.querySelector("output").textContent = el.value + (c.unit || "");
        });
        return v;
      };
      const update = () => {
        const code = def.draw(read(), stage);
        out.innerHTML = window.hl ? window.hl(code, "css") : esc(code);
      };
      body.querySelector(".lab-controls").addEventListener("input", update);
      update();
    };
  }

  const LABS = {};

  LABS.flexbox = {
    title: "Flexbox o'yingohi", desc: "justify-content, align-items, direction, wrap va gap'ni jonli sinang.", lessons: [31, 32],
    render: specLab({
      spec: [
        { k: "dir", label: "flex-direction", type: "select", opts: ["row", "row-reverse", "column", "column-reverse"], val: "row" },

        { k: "wrap", label: "flex-wrap", type: "select", opts: ["nowrap", "wrap"], val: "nowrap" },
        { k: "gap", label: "gap", type: "range", min: 0, max: 40, val: 10, unit: "px" },
        { k: "n", label: "Elementlar soni", type: "range", min: 1, max: 12, val: 4 }

      init(stage) { stage.innerHTML = `<div class="fx-box"></div>`; },

        box.innerHTML = Array.from({ length: v.n }, (_, i) => `<div class="fx-item">${i + 1}</div>`).join("");
        return `.container {\n  display: flex;\n  flex-direction: ${v.dir};\n  justify-content: ${v.jc};\n  align-items: ${v.ai};\n  flex-wrap: ${v.wrap};\n  gap: ${v.gap}px;\n}`;

  /* ---- Prompt konstruktori ---- */
  const PR_EX = {

  /* ---- Git simulyatori ---- */
  LABS.git = {
    title: "Git simulyatori", desc: "init → add → commit → push jarayonini xavfsiz mashq qiling.", lessons: [46, 47],
    render(body) {
      body.innerHTML = `<div class="stage" style="min-height:0">

      let S;

      const term = body.querySelector(".gt-term"), inp = body.querySelector(".gt-in input");
      const line = (t, c) => { const d = document.createElement("div"); if (c) d.className = c; d.textContent = t; term.appendChild(d); term.scrollTop = term.scrollHeight; };
      const draw = () => {
        const f = Object.entries(S.files);
        body.querySelector(".gt-wd").innerHTML = f.map(([n, s]) => `<div class="gt-file ${s === "mod" ? "mod" : ""}">${n}${s === "mod" ? " ✎" : ""}</div>`).join("") || "<i>bo'sh</i>";
        body.querySelector(".gt-st").innerHTML = f.filter(([, s]) => s === "st").map(([n]) => `<div class="gt-file st">${n}</div>`).join("");
        body.querySelector(".gt-lc").innerHTML = S.init ? S.commits.slice().reverse().map((c) => `<div class="gt-commit">${c.id} ${esc(c.m)}</div>`).join("") || "<i>.git tayyor</i>" : "<i>git init qilinmagan</i>";
        body.querySelector(".gt-gh").innerHTML = S.remote ? S.commits.slice(0, S.pushed).reverse().map((c) => `<div class="gt-commit">${c.id} ${esc(c.m)}</div>`).join("") || "<i>repo bo'sh</i>" : "<i>remote ulanmagan</i>";
      };
      const run = (cmd) => {
        line("$ " + cmd, "c");
        const c = cmd.trim().replace(/\s+/g, " ");
        if (c === "help") return line("git --version | git init | git status | git add . | git commit -m \"xabar\" | git log | git remote add origin URL | git push -u origin main | clear");
        if (c === "clear") { term.innerHTML = ""; return; }
        if (c === "git --version") return line("git version 2.45.0");
        if (c.startsWith("git config")) return line("✓ sozlama saqlandi", "g");
        if (!c.startsWith("git ")) return line("Buyruq topilmadi. Git buyruqlari 'git' so'zi bilan boshlanadi.", "e");

        if (!S.init) return line("fatal: not a git repository – avval 'git init' qiling", "e");

          return;
        }
        if (c.startsWith("git add")) {
          const a = c.slice(8).trim();

          let n = 0;
          Object.keys(S.files).forEach((f) => { if ((a === "." || a === f) && S.files[f] === "mod") { S.files[f] = "st"; n++; } });
          draw();
          return n ? line(`✓ ${n} ta fayl staging'ga qo'shildi`, "g") : line("Qo'shiladigan o'zgarish yo'q");
        }
        if (c.startsWith("git commit")) {
          const m = c.match(/-m ["'](.+)["']/);
          if (!m) return line('Xabar kerak: git commit -m "Birinchi commit"', "e");
          const st = Object.keys(S.files).filter((f) => S.files[f] === "st");
          if (!st.length) return line("nothing to commit (avval git add .)", "e");
          st.forEach((f) => (S.files[f] = "ok"));
          const id = Math.random().toString(16).slice(2, 9);
          S.commits.push({ id, m: m[1] }); draw();
          return line(`[main ${id}] ${m[1]}\n ${st.length} files changed`, "g");
        }
        if (c === "git log") return S.commits.length ? S.commits.slice().reverse().forEach((x) => line(`commit ${x.id}  ${x.m}`)) : line("Hali commit yo'q");
        if (c.startsWith("git remote add origin")) { S.remote = c.split(" ").pop(); draw(); return line("✓ origin ulandi: " + S.remote, "g"); }
        if (c.startsWith("git push")) {
          if (!S.remote) return line("fatal: 'origin' topilmadi – git remote add origin URL", "e");
          if (!S.commits.length) return line("error: src refspec main does not match any (avval commit qiling)", "e");
          S.pushed = S.commits.length; draw();
          return line("✓ GitHub'ga yuborildi: " + S.remote + "\n  main -> main", "g");
        }
        line("Bu buyruq simulyatorda yo'q. 'help' yozing.", "e");
      };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && inp.value.trim()) { run(inp.value); inp.value = ""; } });
      body.querySelector(".gt-edit").addEventListener("click", () => { const fs = Object.keys(S.files); const f = fs[Math.floor(Math.random() * fs.length)]; S.files[f] = "mod"; draw(); line(`(${f} fayli o'zgartirildi)`); });
      body.querySelector(".gt-newf").addEventListener("click", () => { const f = `page-${S.n++}.html`; S.files[f] = "mod"; draw(); line(`(${f} yaratildi)`); });
      body.querySelector(".gt-reset").addEventListener("click", reset);
      reset();
    }
  };

  window.LABS = LABS;
  window.renderLab = function (key, el) {

    L.render(bodyEl);
    el.querySelector(".lab-reset").addEventListener("click", () => { bodyEl.innerHTML = ""; L.render(bodyEl); });
  };
})();

</script>
  <script>
/* PS Termiz Web Course – platforma mantiqi (hash router, darslar, taqdimot, playground, o'qituvchi paneli) */
(function () {
  const C = window.COURSE;
  const LESSONS = C.lessons.slice().sort((a, b) => a.n - b.n);
  const TOTAL = LESSONS.length;
  const byN = (n) => LESSONS.find((l) => l.n === n);
  const modOf = (id) => C.modules.find((m) => m.id === id);
  const $ = (s, r = document) => r.querySelector(s);

    set(k, v) { try { localStorage.setItem("pst:" + k, JSON.stringify(v)); } catch (e) { /* xotira yopiq */ } }
  };
  let done = new Set(store.get("done", []));
  const saveDone = () => store.set("done", Array.from(done));

  /* ---------- Yordamchilar ---------- */
  const PRISM_LANG = { html: "markup", css: "css", js: "javascript", scss: "scss", bash: "bash", markdown: "markdown" };
  window.hl = function (code, lang) {

  let toastT;

      const ta = document.createElement("textarea");

      toast(ok ? "Nusxa olindi" : "Nusxa olinmadi – matnni belgilab Ctrl+C bosing");
    };

      navigator.clipboard.writeText(text).then(() => toast("Nusxa olindi"), fallback);
    } catch (e) { fallback(); }
  };
  const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const mcStyle = (l) => `--mc:${modOf(l.m).color}`;

  /* ---------- Dars jadvali (sanalar) ---------- */
  const MONTHS = ["yan", "fev", "mar", "apr", "may", "iyun", "iyul", "avg", "sen", "okt", "noy", "dek"];
  const WD = ["Ya", "Du", "Se", "Ch", "Pa", "Ju", "Sh"];
  const WD_FULL = ["Yakshanba", "Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba"];
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fmtDate = (d) => `${d.getDate()}-${MONTHS[d.getMonth()]}, ${WD[d.getDay()]}`;
  function schedSettings() { return store.get("sched", { start: iso(new Date()), days: [2, 4], skip: "" }); }
  function computeSchedule() {
    const s = schedSettings();
    const map = {};
    if (!s.days || !s.days.length || !s.start) return map;
    const skip = new Set((s.skip || "").split(/[\s,;]+/).filter(Boolean));
    const d = new Date(s.start + "T00:00:00");

  /* ---------- 45 daqiqalik reja ---------- */

  }
  const phaseSpans = (plan) => plan.map(([r, t]) => { const [a, b] = r.split(/[–-]/).map(Number); return { a, b, t, r }; });

  /* ---------- Jonli ko'rinish (iframe) va konsol ---------- */
  let pvSeq = 0;
  const consoles = new Map();

  function hook(id) {

  /* ---------- Test ---------- */

  /* ---------- Dars taymeri (umumiy) ---------- */
  const timer = {
    n: 0, plan: [], total: 45 * 60 * 1000, elapsed: 0, startedAt: 0, running: false, subs: new Set(), lastPhase: -1, int: null,
    load(n) { if (this.n === n) return; this.n = n; this.plan = phaseSpans(planOf(byN(n))); this.reset(); },
    now() { return this.elapsed + (this.running ? Date.now() - this.startedAt : 0); },
    start() { if (this.running) return; this.running = true; this.startedAt = Date.now(); this.int = setInterval(() => this.tick(), 500); this.tick(); },
    pause() { if (!this.running) return; this.elapsed = this.now(); this.running = false; clearInterval(this.int); this.tick(); },
    toggle() { this.running ? this.pause() : this.start(); },
    reset() { this.running = false; clearInterval(this.int); this.elapsed = 0; this.lastPhase = -1; this.tick(); },
    phase() { const m = this.now() / 60000; const i = this.plan.findIndex((p) => m >= p.a && m < p.b); return i === -1 ? (m >= 45 ? this.plan.length - 1 : 0) : i; },
    label() {
      const left = this.total - this.now();
      const a = Math.abs(left);
      const t = `${String(Math.floor(a / 60000)).padStart(2, "0")}:${String(Math.floor((a % 60000) / 1000)).padStart(2, "0")}`;
      return left < 0 ? "+" + t : t;
    },
    tick() {
      const ph = this.phase();
      if (this.running && this.lastPhase !== -1 && ph !== this.lastPhase) beep();
      if (this.running) this.lastPhase = ph;
      this.subs.forEach((f) => f());
    }
  };
  let actx;
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; g.gain.value = 0.08;
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.25);
    } catch (e) { /* ovoz yo'q */ }
  }

  /* ---------- Taqdimot rejimi (doska) ---------- */
  let P = null;
  function buildSlides(l) {

    } });
    S.push({ k: "goals", r: (el) => {
      el.innerHTML = `<div class="codepair"><div><h2>Bugun o'rganamiz</h2><ul class="goals" style="margin-top:14px">${l.goals.map((g) => `<li>${esc(g)}</li>`).join("")}</ul></div>
        <div><h2>Dars rejasi</h2><div class="timeline" style="margin-top:14px">${planOf(l).map(([r, t]) => `<div class="ph"><b>${r}</b><span>${esc(t)}</span></div>`).join("")}</div></div></div>`;
    } });
    l.concepts.forEach((c, i) => S.push({ k: "concept", r: (el) => {

    } }));
    S.push({ k: "cw", r: (el) => {
      el.innerHTML = `<div class="kicker">Amaliy ish · ~20 daqiqa</div><h2>${esc(l.classwork.t)}</h2><p>${esc(l.classwork.d)}</p><ol class="steps">${l.classwork.steps.map((s) => `<li style="font-size:clamp(17px,1.9vw,22px)">${esc(s)}</li>`).join("")}</ol>

      $("#pCw", el).addEventListener("click", () => { openInPlayground(l.classwork.starter || { html: `<h1>${l.classwork.t}</h1>\n` }); });
    } });
    l.quiz.forEach((q, i) => S.push({ k: "q", r: (el) => {
      el.innerHTML = `<div class="kicker">Mini test · ${i + 1}/${l.quiz.length} · javobni ochish: R</div>`;
      const qEl = renderQuestion(q, i);
      $("p", qEl).style.cssText = "font:800 clamp(26px,3.4vw,42px)/1.2 var(--f-display);color:#fff";
      el.appendChild(qEl);
      el.reveal = qEl.reveal;
    } }));
    S.push({ k: "ai", r: (el) => {
      el.innerHTML = `<div class="kicker">AI yordamchi</div><h2>${esc(l.ai.t)}</h2><div class="prompt-text">${esc(l.ai.p)}</div><p style="font-size:18px;color:var(--board-dim)">Qoidalar: shaxsiy ma'lumot yozmaymiz · javobni tekshiramiz · tushunmagan kodni ishlatmaymiz</p>

    } });
    return S;
  }
  function openPresent(n) {
    const l = byN(n);
    timer.load(n);
    const slides = buildSlides(l);
    const ov = document.createElement("div");
    ov.className = "present";
    ov.setAttribute("role", "dialog");
    ov.setAttribute("aria-label", `${n}-dars taqdimoti`);
    ov.innerHTML = `
      <div class="p-bar">
        <button class="p-btn" data-a="close" type="button" title="Chiqish (Esc)">✕</button>
        <span class="ttl">${n}-dars · ${esc(l.title)}</span>
        <span class="p-phase"></span>
        <span class="p-timer" title="Qolgan vaqt">45:00</span>
        <button class="p-btn" data-a="timer" type="button" title="Taymer (T)">▶</button>
        <button class="p-btn" data-a="pen" type="button" title="Qalam (P)">✏️</button>
        <span class="p-colors" hidden>${["#ffe28a", "#ffffff", "#ffb3c7", "#9fd3ff"].map((c, i) => `<button type="button" data-c="${c}" style="background:${c}" class="${i === 0 ? "on" : ""}" aria-label="Rang ${i + 1}"></button>`).join("")}<button class="p-btn" data-a="clear" type="button" title="Tozalash">🧽</button></span>
        <button class="p-btn" data-a="fs" type="button" title="To'liq ekran (F)">⛶</button>
      </div>
      <div class="p-stage"><div class="slide"></div><canvas class="p-draw" hidden></canvas></div>
      <div class="p-foot">
        <button class="p-btn" data-a="prev" type="button">←</button>
        <div class="p-dots">${slides.map((s, i) => `<button type="button" data-i="${i}" class="${s.k === "q" ? "q" : ""}" aria-label="${i + 1}-slayd"></button>`).join("")}</div>
        <span class="p-keys">← → · F · P · T · R · Esc</span>
        <span class="p-count mono" style="font-size:14px"></span>
        <button class="p-btn" data-a="next" type="button">→</button>
      </div>`;
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";
    const slideEl = $(".slide", ov), stage = $(".p-stage", ov), cv = $("canvas", ov);
    const st = { i: 0, pen: false, color: "#ffe28a" };
    const show = (i) => {
      st.i = Math.max(0, Math.min(slides.length - 1, i));
      slideEl.innerHTML = "";
      slideEl.reveal = null;
      slides[st.i].r(slideEl);
      stage.scrollTop = 0;
      $$(".p-dots button", ov).forEach((b, j) => b.classList.toggle("on", j === st.i));
      $(".p-count", ov).textContent = `${st.i + 1}/${slides.length}`;
      clearCanvas();
    };
    const tick = () => {
      const t = $(".p-timer", ov);
      t.textContent = timer.label();
      t.classList.toggle("warn", timer.total - timer.now() < 5 * 60000);
      $("[data-a=timer]", ov).textContent = timer.running ? "⏸" : "▶";
      const ph = timer.plan[timer.phase()];
      $(".p-phase", ov).textContent = ph ? `${ph.r} · ${ph.t}` : "";
    };
    timer.subs.add(tick); tick();
    /* Qalam */
    let ctx, drawing = false;
    const sizeCanvas = () => {
      const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      cv.width = r.width * dpr; cv.height = r.height * dpr;
      cv.style.width = r.width + "px"; cv.style.height = r.height + "px";
      cv.style.top = stage.scrollTop + "px";
      ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 4;
    };
    function clearCanvas() { if (ctx) ctx.clearRect(0, 0, cv.width, cv.height); }
    const setPen = (on) => {
      st.pen = on;
      cv.hidden = !on;
      $(".p-colors", ov).hidden = !on;
      $("[data-a=pen]", ov).classList.toggle("on", on);
      if (on) sizeCanvas();
    };
    const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener("pointerdown", (e) => { drawing = true; cv.setPointerCapture(e.pointerId); ctx.strokeStyle = st.color; ctx.beginPath(); ctx.moveTo(...pt(e)); });
    cv.addEventListener("pointermove", (e) => { if (!drawing) return; ctx.lineTo(...pt(e)); ctx.stroke(); });
    cv.addEventListener("pointerup", () => (drawing = false));
    $$(".p-colors [data-c]", ov).forEach((b) => b.addEventListener("click", () => { st.color = b.dataset.c; $$(".p-colors [data-c]", ov).forEach((x) => x.classList.toggle("on", x === b)); }));
    const act = {
      close: () => { location.hash = "lesson-" + n; },
      prev: () => show(st.i - 1),
      next: () => show(st.i + 1),
      timer: () => timer.toggle(),
      pen: () => setPen(!st.pen),
      clear: () => clearCanvas(),
      fs: () => {
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else { const p = ov.requestFullscreen && ov.requestFullscreen(); if (p && p.catch) p.catch(() => toast("To'liq ekran bu yerda mavjud emas")); }
        } catch (e) { toast("To'liq ekran bu yerda mavjud emas"); }
      }
    };
    ov.addEventListener("click", (e) => {
      const a = e.target.closest("[data-a]");
      if (a && act[a.dataset.a]) act[a.dataset.a]();
      const d = e.target.closest(".p-dots [data-i]");
      if (d) show(+d.dataset.i);
    });
    const onKey = (e) => {
      if (e.target.closest("input, textarea, select, [contenteditable], .hk-zone")) return;
      const k = e.key;
      if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); act.next(); }
      else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); act.prev(); }
      else if (k === "Escape") { if (!document.fullscreenElement) act.close(); }
      else if (k === "f" || k === "F") act.fs();
      else if (k === "p" || k === "P") act.pen();
      else if (k === "t" || k === "T") act.timer();
      else if ((k === "r" || k === "R") && slideEl.reveal) slideEl.reveal();
      else if (k === "Home") show(0);
      else if (k === "End") show(slides.length - 1);
    };
    document.addEventListener("keydown", onKey);
    const onResize = () => { if (st.pen) sizeCanvas(); };

  /* ---------- O'qituvchi paneli ---------- */
  function renderTeacher() {
    setNav("teacher");
    document.title = "O'qituvchi paneli · PS Termiz";
    const s = schedSettings();
    const names = store.get("names", "Aziz\nMadina\nJasur\nDilnoza\nSardor\nMalika\nBekzod\nNilufar\nOtabek\nShahzoda");

    app.innerHTML = `<div style="margin-bottom:16px"><div class="eyebrow">Sinfni boshqarish</div><h1 style="font-size:40px">O'qituvchi paneli</h1></div>
      <div class="t-grid">
        <section class="panel wide">
          <div class="row" style="justify-content:space-between"><h2>⏱ Dars taymeri</h2>
            <label class="field" style="min-width:0;flex:1 1 260px;max-width:460px"><span class="lbl">Dars</span><select id="tl">${LESSONS.map((l) => `<option value="${l.n}"${l.n === timer.n ? " selected" : ""}>${l.n}. ${esc(l.title)}</option>`).join("")}</select></label></div>

          <div class="row muted" id="pbl" style="font-size:12.5px;gap:14px"></div>
          <p class="muted" style="font-size:13px;margin:8px 0 0">Bosqich almashganda qisqa signal chalinadi. Taymer taqdimot rejimida ham ko'rinadi.</p>
        </section>
        <section class="panel">
          <h2>🎯 Tasodifiy o'quvchi</h2>
          <div class="field"><label for="names">Sinf ro'yxati (har qatorda bitta ism)</label><textarea id="names" rows="6">${esc(names)}</textarea></div>
          <div class="row" style="margin-top:10px"><button class="btn primary" id="pick" type="button">Tanlash</button><label class="row" style="gap:6px;font-size:14px;font-weight:700"><input type="checkbox" id="norep" checked> takrorlanmasin</label></div>
          <div class="picked" id="picked" aria-live="polite"></div>
        </section>
        <section class="panel">
          <h2>👥 Guruhlarga bo'lish</h2>
          <div class="row"><label class="field" style="width:120px"><span class="lbl">Guruhlar soni</span><input id="gn" type="number" min="2" max="10" value="3"></label><button class="btn primary" id="grp" type="button" style="align-self:flex-end">Bo'lish</button></div>
          <div class="groups" id="groups"></div>
        </section>
        <section class="panel wide">
          <h2>📅 Dars jadvali</h2>
          <div class="row" style="align-items:flex-end">
            <label class="field"><span class="lbl">Boshlanish sanasi</span><input id="sd" type="date" value="${esc(s.start)}"></label>
            <div class="field"><span class="lbl">Dars kunlari (haftasiga ${C.perWeek} ta)</span><div class="days">${[1, 2, 3, 4, 5, 6].map((d) => `<label><input type="checkbox" value="${d}"${s.days.includes(d) ? " checked" : ""}> ${WD_FULL[d]}</label>`).join("")}</div></div>

    let used = new Set();

      if (!all.length) { $("#picked").textContent = "Ro'yxat bo'sh – ismlarni kiriting"; return; }
      let pool = $("#norep").checked ? all.filter((x) => !used.has(x)) : all;
      if (!pool.length) { used = new Set(); pool = all; }

        el.textContent = all[Math.floor(Math.random() * all.length)];

      const map = computeSchedule();
      const today = iso(new Date());

      const nextN = keys.map(Number).find((n) => iso(map[n]) >= today);

        const d = map[l.n];

      }).join("");
    };
    const saveSched = () => {
      store.set("sched", { start: $("#sd").value, days: $$(".days input:checked").map((x) => +x.value), skip: $("#skip").value });
      drawSched();
    };
    $("#sd").addEventListener("change", saveSched);
    $("#skip").addEventListener("change", saveSched);
    $$(".days input").forEach((x) => x.addEventListener("change", saveSched));
    drawSched();

    let armed = false;
    $("#resetP").addEventListener("click", (e) => {
      if (!armed) { armed = true; e.target.textContent = "Rostdan tozalaysizmi? Yana bosing"; setTimeout(() => { armed = false; e.target.textContent = "Progressni tozalash"; }, 3000); return; }
      done = new Set(); saveDone(); $("#pdone").textContent = 0; drawSched();

  }

  const themeBtn = $("#theme");

  themeBtn.addEventListener("click", () => {

    store.set("theme", nx); applyTheme(nx);
  });

  window.addEventListener("hashchange", route);
  route();
})();
